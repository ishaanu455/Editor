name: Build & Release Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install npm packages
        working-directory: mobile
        run: npm install

      - name: Generate Android project
        working-directory: mobile
        run: |
          npx cap add android
          # custom MainActivity (Basic Auth dialog + download handler)
          cp android-overrides/MainActivity.java android/app/src/main/java/com/aegisx/editor/MainActivity.java
          # storage permission for Android 9 and below
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          # version
          BASE=$(node -p "require('./package.json').version")
          echo "VERSION_NAME=${BASE%.*}.$VERSION_CODE" >> "$GITHUB_ENV"
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/; s/versionName \"1.0\"/versionName \"${BASE%.*}.$VERSION_CODE\"/" android/app/build.gradle
          npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/AegisX-Editor.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AegisX-Editor-apk
          path: AegisX-Editor.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: AegisX Editor v${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: AegisX-Editor.apk
