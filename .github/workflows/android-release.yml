name: Build & Release Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install npm packages
        working-directory: mobile
        run: npm install

      - name: Generate Android project
        working-directory: mobile
        run: |
          npx cap add android
          # custom MainActivity (Basic Auth dialog + download handler)
          cp android-overrides/MainActivity.java android/app/src/main/java/com/aegisx/editor/MainActivity.java
          # storage permission for Android 9 and below
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          # version
          BASE=$(node -p "require('./package.json').version")
          echo "VERSION_NAME=${BASE%.*}.$VERSION_CODE" >> "$GITHUB_ENV"
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/; s/versionName \"1.0\"/versionName \"${BASE%.*}.$VERSION_CODE\"/" android/app/build.gradle
          npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            ./gradlew assembleRelease --no-daemon
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            export KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --out "$GITHUB_WORKSPACE/AegisX-Editor.apk" "$RUNNER_TEMP/aligned.apk"
          else
            echo "::warning::No signing keystore secret found - building a debug-signed APK (cannot update over previous installs)."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/AegisX-Editor.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AegisX-Editor-apk
          path: AegisX-Editor.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: AegisX Editor v${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: AegisX-Editor.apk
